<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline - Tasmania Aerial Photo Explorer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
      text-align: center;
      padding: 1rem;
    }
    .container { max-width: 400px; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { opacity: 0.7; line-height: 1.6; }
    button {
      margin-top: 1rem;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 999px;
      background: #2ac56a;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #1cad59; }
  </style>
</head>
<body>
  <div class="container">
    <h1>You're offline</h1>
    <p>Tasmania Aerial Photo Explorer requires an internet connection to search and browse aerial photos.</p>
    <p>Previously viewed photos and map tiles may still be available.</p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
