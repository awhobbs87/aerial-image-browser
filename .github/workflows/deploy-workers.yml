name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oxlint-oxfmt:
    name: Oxlint & Oxfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting with oxfmt
        run: npm run format:ox:check

      - name: Lint with oxlint
        run: npm run lint:ox

  typecheck-and-unit:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run type-check

      - name: Run unit tests
        run: npm run test:unit

  theme-regression:
    name: Theme Regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run theme unit tests
        run: npm run test:unit -- tests/unit/lib/theme.test.ts

      - name: Run theme browser regressions
        run: npx playwright test tests/e2e/theme.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-theme-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - oxlint-oxfmt
      - typecheck-and-unit
      - theme-regression
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Worker
        run: npm run build

      # Deployment is handled by Cloudflare's connected build system.
      # To re-enable direct wrangler deploy from GitHub Actions, add
      # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets and run:
      # npx wrangler deploy
